# Analyse SonarQube Cloud — lancée par .github/workflows/ci.yml (job « sonar »).
# Les deux premières valeurs sont affichées par SonarQube Cloud lors de l'import du dépôt :
# vérifiez-les dans « Information » du projet et corrigez-les ici si elles diffèrent.
sonar.organization=jn-mond
sonar.projectKey=Jn-mond_le-grand-cinema
sonar.projectName=Le Grand Cinéma

sonar.sourceEncoding=UTF-8
# Tout le code du dépôt est analysé : application, workflow, scripts SQL et shell, page de documentation.
sonar.sources=.github,db,web/src,web/public
sonar.tests=web/src
sonar.test.inclusions=web/src/**/*.test.ts,web/src/test/**
sonar.exclusions=web/src/**/*.test.ts,web/src/test/**
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
# Code d'infrastructure (routes HTTP, accès Supabase) : vérifié par les tests d'intégration et le build,
# pas par les tests unitaires. Il reste analysé par Sonar, mais hors du calcul de couverture.
sonar.coverage.exclusions=web/src/app/**,web/src/proxy.ts,web/src/**/*-supabase.ts,web/src/lib/supabase-serveur.ts,web/src/lib/supabase-auth.ts,web/src/lib/session.ts
